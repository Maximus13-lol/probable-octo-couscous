name: Publish the approved Mona Lisa episode
on:
  pull_request:
    paths: ['.github/workflows/monalisa-screening.yml']

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/editorial-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: approved
        run: |
          if [ "$(git log -1 --format=%s)" = "Publish the existing approved Mona Lisa episode" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.approved.outputs.yes == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: 44950723394
          name: monalisa-full-fira
          path: work
      - name: Publish the existing video and apply the custom cover
        if: steps.approved.outputs.yes == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth google-auth-oauthlib requests
          python - <<'PY'
          import json
          from googleapiclient.errors import HttpError
          from googleapiclient.http import MediaFileUpload
          from src.upload import get_youtube_client

          video_id = "oiTkyZ0xWig"
          yt = get_youtube_client()
          if yt is None:
              raise RuntimeError("Missing YouTube credentials")
          items = yt.videos().list(part="snippet,status", id=video_id).execute().get("items", [])
          status = items[0]["status"] if items else {
              "privacyStatus": "unlisted", "selfDeclaredMadeForKids": False,
              "containsSyntheticMedia": True, "embeddable": True,
          }
          if status["privacyStatus"] != "public":
              fields = ("embeddable", "license", "publicStatsViewable",
                        "selfDeclaredMadeForKids", "containsSyntheticMedia")
              settings = {key: status[key] for key in fields if key in status}
              settings["privacyStatus"] = "public"
              try:
                  status = yt.videos().update(part="status", body={"id": video_id, "status": settings}).execute()["status"]
              except HttpError as error:
                  status = {"privacyStatus": "update rejected", "error": json.loads(error.content)["error"]}
          listed = yt.videos().list(part="status", id=video_id).execute().get("items", [])
          current = listed[0]["status"] if listed else status
          print(json.dumps({"publication": status}, ensure_ascii=False))
          try:
              media = MediaFileUpload("work/thumbnail.jpg", mimetype="image/jpeg")
              yt.thumbnails().set(videoId=video_id, media_body=media).execute(num_retries=4)
              thumbnail = "ok"
          except HttpError as error:
              payload = json.loads(error.content)
              thumbnail = {"status": error.resp.status, "details": payload["error"].get("message"),
                           "reasons": [x.get("reason") for x in payload["error"].get("errors", [])]}
          print(json.dumps({"video_id": video_id, "visibility": current["privacyStatus"],
                            "thumbnail": thumbnail}, ensure_ascii=False))
          PY
