name: Daily YouTube Short

on:
  schedule:
    # Слоты выхода (МСК) — config/schedule.json; сборка стартует ~за 1 ч 40 мин, ролик выходит ровно в слот
    # (отложенная публикация YouTube). Встроенный cron GitHub здесь не срабатывал — основной запуск делает
    # внешний будильник (workflow_dispatch scheduled=true); эти cron оставлены про запас.
    - cron: "10 12 * * *"    # 15:10 МСК → слот 17:00
    - cron: "10 13 * * *"    # 16:10 МСК — резерв
    - cron: "10 14 * * *"    # 17:10 МСК → слот 19:00
    - cron: "10 15 * * *"    # 18:10 МСК — резерв
    - cron: "10 16 * * *"    # 19:10 МСК → слот 21:00
    - cron: "10 17 * * *"    # 20:10 МСК — резерв
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Не загружать на YouTube (тестовый прогон)"
        type: boolean
        default: true
      test_ad:
        description: "Вставить тестовую рекламу (без загрузки)"
        type: boolean
        default: false
      topic:
        description: "Тема вручную (пусто = trend-scout)"
        type: string
        required: false
      scheduled:
        description: "Запуск по расписанию из внешнего будильника (проходит через страж)"
        type: boolean
        default: false

permissions:
  contents: write   # чтобы сохранить used_topics.json, publish_log.json, ads/log.json, inbox/
  issues: write     # режим «живой голос»: уведомление о новом сценарии для начитки

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: "1"
      PUBLISH: ${{ github.event_name == 'schedule' || (inputs.no_upload == false && inputs.test_ad == false) }}
      GUARD_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main на момент старта (а не на момент постановки в очередь) — с журналом прошлых запусков

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Нужен ли ролик сейчас? (страж расписания)
        id: guard
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth requests
          python -m src.schedule_guard

      - name: Кэш FFmpeg
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-btbn-v1

      - name: FFmpeg (статическая сборка, без apt)
        if: steps.guard.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          # apt-зеркала на раннерах GitHub 11.11.2026 зависали на 30+ минут — ставим FFmpeg без apt.
          # Шрифт DejaVu Sans Bold лежит в assets/fonts, установка шрифтов не нужна.
          D="$HOME/ffmpeg-static"
          if [ ! -x "$D/ffmpeg" ] || [ ! -x "$D/ffprobe" ]; then
            mkdir -p "$D" && cd "$D"
            curl -fsSL --retry 3 --max-time 240 -o f.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xJf f.tar.xz --wildcards --strip-components=2 '*/bin/ffmpeg' '*/bin/ffprobe' \
              || { curl -fsSL --retry 3 --max-time 240 -o f.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
                   && tar -xJf f.tar.xz --wildcards --strip-components=1 '*/ffmpeg' '*/ffprobe'; } \
              || true
            rm -f f.tar.xz
          fi
          if [ -x "$D/ffmpeg" ]; then
            echo "$D" >> "$GITHUB_PATH"; "$D/ffmpeg" -hide_banner -version | head -1
          elif ! command -v ffmpeg >/dev/null; then
            echo "::warning::статическая сборка недоступна — пробую apt"
            timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq && \
            timeout 300 sudo apt-get -y -qq install ffmpeg
          fi

      - name: Python-зависимости
        if: steps.guard.outputs.run == 'true'
        timeout-minutes: 15
        run: pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Кэш моделей RUAccent, faster-whisper и Vosk (скачиваются один раз)
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/ruaccent
            .cache/whisper
            ~/.cache/vosk
          key: models-ruaccent-1.5.8.3-whisper-small-vosk-0.9-v2

      - name: Конвейер
        if: steps.guard.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # запасной поставщик текстов, если Gemini перегружен (бесплатные модели OpenRouter)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # необязательно: если заданы, озвучка пойдёт через Azure, а Gemini TTS станет запасным
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          SLOT: ${{ steps.guard.outputs.slot }}
          PUBLISH_AT: ${{ steps.guard.outputs.publish_at }}
        run: |
          ARGS=""
          if [ "$PUBLISH" != "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ "${{ inputs.test_ad }}" = "true" ]; then ARGS="$ARGS --test-ad"; fi
          run() {
            if [ -n "$TOPIC" ]; then python -m src.main $ARGS --topic "$TOPIC"; else python -m src.main $ARGS; fi
          }
          # Если сервисы временно перегружены (Gemini, Pollinations) — одна повторная попытка через 10 минут
          run || { echo "::warning::Первая попытка не удалась — повтор через 10 минут"; sleep 600; run; }

      - name: Артефакт — готовое видео и файлы запуска
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/*.json
            output/*/subtitles.srt
            output/*/narration/*
            output/*/ad_preview.jpg
            output/*/images/*.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Артефакт — trends_report.json
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trends-report-${{ github.run_number }}
          path: output/*/trends_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Уведомление о сценарии для живой озвучки
        if: success() && env.PUBLISH == 'true' && steps.guard.outputs.run == 'true' && hashFiles('output/HUMAN_NOTIFY.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(head -1 output/HUMAN_NOTIFY.md | sed 's/^# *//')
          gh issue create --title "🎙 Начитать: $TITLE" --body-file output/HUMAN_NOTIFY.md || echo "::warning::не удалось создать issue"

      - name: Сохранить состояние (темы, логи публикаций и показов рекламы)
        if: success() && env.PUBLISH == 'true' && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_topics.json publish_log.json ads/log.json trends_quota.json 2>/dev/null || true
          git add -A inbox 2>/dev/null || true   # режим «живой голос»: новые сценарии / удалённые после публикации
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "chore: состояние после публикации $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q && git push && break
            sleep $((i * 5))
          done
