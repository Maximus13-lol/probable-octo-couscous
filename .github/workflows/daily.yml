name: Daily YouTube Short

on:
  schedule:
    # Утренняя и вечерняя сборка с резервными запусками (UTC).
    - cron: "7,37 1-5,11-15,17-20 * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Не загружать на YouTube (тестовый прогон)"
        type: boolean
        default: true
      test_ad:
        description: "Вставить тестовую рекламу (без загрузки)"
        type: boolean
        default: false
      topic:
        description: "Тема вручную (пусто = trend-scout)"
        type: string
        required: false
      scheduled:
        description: "Запуск по расписанию из внешнего будильника (проходит через страж)"
        type: boolean
        default: false
      allow_voice_fallback:
        description: "Разрешить запасной голос, если озвучка голосом автора не удалась"
        type: boolean
        default: false
      pilot:
        description: "Пробный ролик со всеми улучшениями (config/quality.json), загрузка по ссылке (unlisted)"
        type: boolean
        default: false
      rubric:
        description: "Рубрика для пробного ролика: mystery / versions / myth (пусто — по кругу)"
        type: string
        required: false

permissions:
  contents: write   # чтобы сохранить used_topics.json, publish_log.json, ads/log.json, inbox/
  issues: write     # режим «живой голос»: уведомление о новом сценарии для начитки

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PUBLISH: ${{ github.event_name == 'schedule' || (inputs.no_upload == false && inputs.test_ad == false) }}
      GUARD_SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий main на момент старта (а не на момент постановки в очередь) — с журналом прошлых запусков

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Нужен ли ролик сейчас? (страж расписания)
        id: guard
        run: python -m src.schedule_guard

      - name: Комментарий с вопросом под вышедшими роликами
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install -q google-api-python-client google-auth requests
          python -m src.comments
          if ! git diff --quiet publish_log.json; then
            bash tools/save_state.sh "chore: комментарии под роликами [skip ci]"
          fi

      - name: Кэш FFmpeg
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-btbn-v1

      - name: FFmpeg (статическая сборка, без apt)
        if: steps.guard.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          # apt-зеркала на раннерах GitHub 11.11.2026 зависали на 30+ минут — ставим FFmpeg без apt.
          # Шрифт DejaVu Sans Bold лежит в assets/fonts, установка шрифтов не нужна.
          D="$HOME/ffmpeg-static"
          if [ ! -x "$D/ffmpeg" ] || [ ! -x "$D/ffprobe" ]; then
            mkdir -p "$D" && cd "$D"
            curl -fsSL --retry 3 --max-time 240 -o f.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xJf f.tar.xz --wildcards --strip-components=2 '*/bin/ffmpeg' '*/bin/ffprobe' \
              || { curl -fsSL --retry 3 --max-time 240 -o f.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
                   && tar -xJf f.tar.xz --wildcards --strip-components=1 '*/ffmpeg' '*/ffprobe'; } \
              || true
            rm -f f.tar.xz
          fi
          if [ -x "$D/ffmpeg" ]; then
            echo "$D" >> "$GITHUB_PATH"; "$D/ffmpeg" -hide_banner -version | head -1
          elif ! command -v ffmpeg >/dev/null; then
            echo "::warning::статическая сборка недоступна — пробую apt"
            timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq && \
            timeout 300 sudo apt-get -y -qq install ffmpeg
          fi

      - name: Python-зависимости
        if: steps.guard.outputs.run == 'true'
        timeout-minutes: 15
        run: pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Кэш моделей RUAccent, faster-whisper и Vosk (скачиваются один раз)
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/ruaccent
            .cache/whisper
            ~/.cache/vosk
          key: models-ruaccent-1.5.8.3-whisper-small-vosk-0.9-v2

      - name: Голос автора — образец (расшифровка)
        id: voice
        if: steps.guard.outputs.run == 'true'
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          if [ -z "$VOICE_KEY" ] || [ ! -f assets/voice/ref.flac.gpg ]; then
            echo "::warning::Нет VOICE_KEY — озвучка запасным голосом"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$VOICE_KEY" -o assets/voice/ref.flac -d assets/voice/ref.flac.gpg \
            && echo "ok=true" >> "$GITHUB_OUTPUT" || { echo "::warning::Образец голоса не расшифрован"; echo "ok=false" >> "$GITHUB_OUTPUT"; }

      - name: Голос автора — кэш окружения Qwen3-TTS и модели
        if: steps.voice.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: ~/qwen-venv
          key: qwen-venv-0.1.1-v2

      - name: Голос автора — окружение Qwen3-TTS
        if: steps.voice.outputs.ok == 'true'
        timeout-minutes: 15
        run: |
          if [ ! -x ~/qwen-venv/bin/python ]; then
            python -m venv ~/qwen-venv
            ~/qwen-venv/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
            ~/qwen-venv/bin/pip install -q qwen-tts==0.1.1 faster-whisper
          fi
          ~/qwen-venv/bin/python -c "import qwen_tts, faster_whisper; print('qwen-tts ok')" \
            && echo "QWEN_PY=$HOME/qwen-venv/bin/python" >> "$GITHUB_ENV" || echo "::warning::Qwen3-TTS недоступен"

      - name: Конвейер
        if: steps.guard.outputs.run == 'true'
        env:
          # Только бесплатные модели OpenRouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          PILOT: ${{ inputs.pilot }}
          RUBRIC: ${{ inputs.rubric }}
          PRIVACY_OVERRIDE: ${{ inputs.pilot == true && 'unlisted' || '' }}
          SLOT: ${{ steps.guard.outputs.slot }}
          SLOT_DATE: ${{ steps.guard.outputs.slot_date }}
          SLOT_DEADLINE: ${{ steps.guard.outputs.deadline }}
          PUBLISH_AT: ${{ steps.guard.outputs.publish_at }}
        run: |
          ARGS=""
          if [ "$PUBLISH" != "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ "${{ inputs.test_ad }}" = "true" ]; then ARGS="$ARGS --test-ad"; fi
          if [ "${{ inputs.allow_voice_fallback }}" = "true" ]; then ARGS="$ARGS --allow-voice-fallback"; fi
          if [ -n "$TOPIC" ]; then
            python -m src.main $ARGS --topic "$TOPIC"
          else
            python -m src.main $ARGS
          fi

      - name: Сохранить состояние (темы, логи публикаций и показов рекламы)
        if: always() && env.PUBLISH == 'true' && steps.guard.outputs.run == 'true'
        run: |
          bash tools/save_state.sh "chore: состояние после публикации $(date -u +%F) [skip ci]"

      - name: Артефакт — готовое видео и файлы запуска
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/*.json
            output/*/subtitles.srt
            output/*/narration/*
            output/*/cover.jpg
            output/*/ad_preview.jpg
            output/*/images/*.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Артефакт — trends_report.json
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trends-report-${{ github.run_number }}
          path: output/*/trends_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Уведомление о сценарии для живой озвучки
        if: success() && env.PUBLISH == 'true' && steps.guard.outputs.run == 'true' && hashFiles('output/HUMAN_NOTIFY.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(head -1 output/HUMAN_NOTIFY.md | sed 's/^# *//')
          gh issue create --title "🎙 Начитать: $TITLE" --body-file output/HUMAN_NOTIFY.md || echo "::warning::не удалось создать issue"
