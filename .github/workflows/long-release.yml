name: Upload rendered evening Short for review
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: short-review-45859613054
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45859613054
          name: short-184
          path: rendered
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install 'Pillow>=10,<12' google-api-python-client google-auth numpy
      - name: Upload with link-only visibility
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import time
          from pathlib import Path

          from src import upload
          from src.utils import load_json, setup_logging

          setup_logging()
          (video,) = Path("rendered").rglob("final.mp4")
          assert video.parent.name == "20261126_163430"
          summary = load_json(video.with_name("summary.json"))
          story = load_json(video.with_name("story.json"))
          story["case"] = summary.get("case")
          assembly = load_json(video.with_name("assembly.json"))
          ad_info = load_json(video.with_name("ad_info.json"), default=None)
          meta = upload.build_metadata(story, ad_info, assembly.get("music_credit"))
          meta.update(privacy_status="unlisted", notify_subscribers=False)
          result = upload.upload(video, meta, video.parent)
          video_id = result["video_id"]
          client = upload.get_youtube_client()
          for _ in range(30):
              [item] = client.videos().list(part="status", id=video_id).execute()["items"]
              status = item["status"]
              if status["privacyStatus"] != "unlisted":
                  raise RuntimeError("YouTube не подтвердил доступ по ссылке")
              if status.get("uploadStatus") in {"processed", "failed", "rejected", "deleted"}:
                  break
              time.sleep(10)
          if status.get("uploadStatus") in {"failed", "rejected", "deleted"}:
              raise RuntimeError(f"YouTube отклонил видео: {status}")
          print(f"Подтверждён доступ по ссылке: https://youtube.com/shorts/{video_id}", flush=True)
          PY
