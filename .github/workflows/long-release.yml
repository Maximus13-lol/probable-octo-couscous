name: Dry run long episode (no YouTube)
on:
  workflow_dispatch:
  push:
    branches: [test/long-vosK-no-upload]
    paths: [.github/workflows/long-release.yml]
permissions:
  contents: read
  actions: read
jobs:
  wait-for-short:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Wait for Shorts dry run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            result=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/45717545778" --jq '.status + " " + (.conclusion // "")')
            if [[ "$result" == completed* ]]; then
              echo "Shorts run: $result"
              break
            fi
            sleep 30
          done
  render:
    needs: wait-for-short
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Select test date
        id: selection
        run: |
          date=$(TZ=Europe/Moscow date +%F)
          printf '{"date":"%s","publish_at":null}\n' "$date" > "$RUNNER_TEMP/episode.json"
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - name: Подготовить сценарий и архивные кадры
        if: steps.selection.outputs.date != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m pip install --retries 5 requests
          python -m src.long_release prepare "$RUNNER_TEMP/episode.json"
      - name: Собрать видео локальным голосом Vosk
        if: steps.selection.outputs.date != ''
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --retries 5 -r requirements.txt
          python -m src.long_release render "$RUNNER_TEMP/episode.json"
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/long-release/pilot.mp4)
          python -c 'import sys; d = float(sys.argv[1]); sys.exit(0 if 600 <= d <= 1800 else f"Unexpected runtime: {d:.0f}s")' "$duration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-vosK-dry-run
          path: |
            output/long-release/pilot.mp4
            output/long-release/thumbnail.jpg
            output/long-release/tts.json
            output/long-release/sources.json
            output/long-release/draft/*/dossier.json
